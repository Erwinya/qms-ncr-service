services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qms_ncr
      POSTGRES_USER: qms
      POSTGRES_PASSWORD: qms
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qms -d qms_ncr"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://db:5432/qms_ncr
      DB_USERNAME: qms
      DB_PASSWORD: qms
    depends_on:
      db:
        condition: service_healthy
